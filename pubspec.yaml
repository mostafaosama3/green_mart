name: green_mart
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  gap: ^3.0.1
  pinput: ^6.0.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - Assets/images/
    - Assets/icons/
fonts:
  - family: poppins
    fonts:
      - asset: Assets/fonts/Poppins-Bold.ttf
        weight: 700
      - asset: Assets/fonts/Poppins-Medium.ttf
        weight: 500
      - asset: Assets/fonts/Poppins-Regular.ttf
        weight: 400
      - asset: Assets/fonts/Poppins-SemiBold.ttf
        weight: 600
